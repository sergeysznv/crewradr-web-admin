<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced vs Classic Markers</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #fff; }
  .container { display: flex; height: 100vh; }
  .panel { flex: 1; display: flex; flex-direction: column; }
  .panel-header {
    padding: 12px 16px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .badge {
    font-size: 10px; padding: 2px 8px; border-radius: 99px;
    font-weight: 500;
  }
  .badge-vector { background: #7c3aed; }
  .badge-raster { background: #059669; }
  .divider { width: 1px; background: #374151; }
  .map { flex: 1; }
  .footer {
    padding: 8px 16px; font-size: 11px; color: #9ca3af;
    text-align: center; border-top: 1px solid #374151;
  }
</style>
</head>
<body>
<div class="container">
  <div class="panel">
    <div class="panel-header" style="background:#2d1b69;">
      Advanced Markers <span class="badge badge-vector">VECTOR</span>
      <span style="font-size:11px;font-weight:400;opacity:0.7;">mapId required</span>
    </div>
    <div id="map-advanced" class="map"></div>
    <div class="footer">Custom HTML avatars + name pills &bull; GPU-accelerated &bull; gmp-click events</div>
  </div>
  <div class="divider"></div>
  <div class="panel">
    <div class="panel-header" style="background:#064e3b;">
      Classic Markers <span class="badge badge-raster">RASTER</span>
      <span style="font-size:11px;font-weight:400;opacity:0.7;">no mapId</span>
    </div>
    <div id="map-classic" class="map"></div>
    <div class="footer">Image-only icons &bull; CPU rendering &bull; click events</div>
  </div>
</div>

<script>
const KEY = 'AIzaSyA0aEWcaRw3O7xlLdmED75zTyFMmMcvasY';
const MAP_ID = 'd19f175a236b93d2f162d2c2';
const CENTER = { lat: 39.8, lng: -98.5 };
const ZOOM = 4;

const SAMPLE_POSITIONS = [
  { lat: 40.7128, lng: -74.0060, name: 'Alice', emoji: '👩', avatar: null },
  { lat: 34.0522, lng: -118.2437, name: 'Bob', emoji: '👨', avatar: null },
  { lat: 41.8781, lng: -87.6298, name: 'Carol', emoji: '👩‍💼', avatar: null },
  { lat: 29.7604, lng: -95.3698, name: 'Dave', emoji: '👨‍🔧', avatar: null },
  { lat: 33.4484, lng: -112.0740, name: 'Eve', emoji: '👩‍🚀', avatar: null },
  { lat: 47.6062, lng: -122.3321, name: 'Frank', emoji: '🧑', avatar: null },
];

// --- Advanced Markers ---
(async () => {
  const { Map } = await google.maps.importLibrary('maps');
  const { AdvancedMarkerElement } = await google.maps.importLibrary('marker');

  const mapAdv = new Map(document.getElementById('map-advanced'), {
    center: CENTER, zoom: ZOOM,
    mapId: MAP_ID,
    disableDefaultUI: true,
    gestureHandling: 'greedy',
  });

  for (const p of SAMPLE_POSITIONS) {
    const size = 42;
    const color = '#34D399';
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'display:flex;flex-direction:column;align-items:center;cursor:pointer;';

    const circle = document.createElement('div');
    circle.style.cssText = `width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:${color};border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25);`;
    const letter = document.createElement('span');
    letter.style.cssText = 'color:#fff;font-size:16px;font-weight:700;line-height:1;';
    letter.textContent = p.emoji;
    circle.appendChild(letter);

    const pointer = document.createElement('div');
    pointer.style.cssText = 'width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #34D399;margin-top:-1px;';

    const pill = document.createElement('span');
    pill.style.cssText = 'background:rgba(0,0,0,.78);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;margin-top:2px;pointer-events:none;';
    pill.textContent = p.name;

    wrapper.appendChild(circle);
    wrapper.appendChild(pointer);
    wrapper.appendChild(pill);

    new AdvancedMarkerElement({ map: mapAdv, position: p, content: wrapper });
  }
})();

// --- Classic Markers ---
(async () => {
  const { Map } = await google.maps.importLibrary('maps');

  const mapClassic = new Map(document.getElementById('map-classic'), {
    center: CENTER, zoom: ZOOM,
    disableDefaultUI: true,
    gestureHandling: 'greedy',
  });

  for (const p of SAMPLE_POSITIONS) {
    new google.maps.Marker({
      map: mapClassic,
      position: p,
      title: p.name,
      label: { text: p.emoji, fontSize: '16px' },
      icon: {
        path: google.maps.SymbolPath.CIRCLE,
        scale: 8,
        fillColor: '#34D399',
        fillOpacity: 1,
        strokeColor: '#fff',
        strokeWeight: 2.5,
      },
    });
  }
})();
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA0aEWcaRw3O7xlLdmED75zTyFMmMcvasY&v=quarterly&libraries=marker&loading=async&callback=Function.prototype"></script>
</body>
</html>
